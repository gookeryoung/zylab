[project]
authors = [{ name = "gookeryoung", email = "gooker_young@qq.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "PySide2>=5.15.2.1; python_version <= '3.10'",
    "PySide6>=6.5.0; python_version >= '3.11'",
    # PySide2/shiboken2 以 NumPy 1.x 编译，2.x 会触发兼容警告甚至崩溃；现代线不受限
    "numpy>=1.24,<2; python_version <= '3.10'",
    "numpy>=1.24; python_version >= '3.11'",
    "scipy>=1.10.1",
    "numba>=0.56.4",
    "h5py>=3.9",
    "psutil>=5.9",
    "pyqtgraph>=0.13",
    "tomli>=2.0; python_version < '3.11'",
    # DSL 模板载体（YAML 是 JSON 超集，两类模板共用同一解析管线）
    "PyYAML>=6.0",
]
description = "通用科学计算仿真分析平台。"
license = "MIT"
name = "zylab"
readme = "README.md"
requires-python = ">=3.8"
version = "0.1.3"

[project.optional-dependencies]
dev = ["zylab[lint,test]", "prek>=0.4.5", "tox-uv>=1.13.1", "tox>=4.25.0"]
docs = ["myst-parser>=3.0", "sphinx-rtd-theme>=2.0", "sphinx>=7.0"]
lint = ["pyrefly>=1.1.1", "ruff>=0.8.0"]
test = [
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-html>=4.1.1",
    # pytest-qt 4.x 移除 PySide2 支持；≤3.10（Win7 线）须用 3.x，其依赖 py 库
    "pytest-qt>=4.2; python_version >= '3.11'",
    "pytest-qt>=3.3,<4; python_version <= '3.10'",
    "py>=1.11; python_version <= '3.10'",
    "pytest-xdist>=3.6.1",
    "pytest>=8.0.0",
]
[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project.scripts]
zylab = "zylab.gui.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/zylab"]

[tool.hatch.build.targets.wheel.force-include]
"src/zylab/py.typed" = "zylab/py.typed"

[tool.uv]
required-version = ">=0.5.0"

[[tool.uv.index]]
default = true
url = "https://mirrors.aliyun.com/pypi/simple/"


[dependency-groups]
dev = ["zylab[dev,docs]"]

[tool.fspack]
exclude = [".trae"]
data-dirs = ["src/zylab/assets"]
pyc_strip = true
no_site = true
# 入口 __main__ 延迟导入 GUI（静态扫描判为 CLI），显式声明为 gui 使 loader
# 以 -mwindows（GUI 子系统）编译，运行时不显示控制台窗口
entry-app-types = { zylab = "gui" }
