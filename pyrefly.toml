preset           = "strict"
project-excludes = [".venv/**", "template/**", "assets/**", "tests/**", "src/zylab/gui/qt_compat.py"]
project-includes = ["**/*.ipynb", "**/*.py*"]
python-version   = "3.10"
search-path      = ["src", "."]

# strict 模式下大量规则依赖第三方包（numpy/scipy/PySide）存根的完整度。
# 目前这些 stub 不完整导致 implicit-any-* / missing-* / bad-* 类规则噪音过多，
# 关闭后保留 strict 中有价值的规则（missing-import / bad-return / invalid-override 等）。
[errors]
# numpy/PySide 泛型参数未显式声明（ndarray[Unknown, Unknown] / QWidget | Unknown）
implicit-any-type-argument = false
# 测试 fixture / 回调 lambda 无显式参数类型
implicit-any-parameter = false
implicit-any-lambda     = false
implicit-any-empty-container = false
implicit-any-attribute  = false
# scipy/sklearn 调用签名与 stub 不一致
missing-argument      = false
missing-attribute     = false
unexpected-keyword    = false
bad-argument-count    = false
bad-argument-type     = false
# PySide 基类泛型参数 Unknown 导致 invalid base class
invalid-inheritance   = false
