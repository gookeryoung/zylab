preset           = "strict"
# GUI 层排除：PySide6 stub 与 pyrefly strict 不兼容（Signal descriptor/枚举短名/objectName kwargs 误报），
# GUI 正确性由 pytest-qt offscreen 运行时测试覆盖；Qt-free 层（core/sci/console）保持严格检查。
project-excludes = [".venv/**", ".venv38/**", "template/**", "tests/**", "src/zylab/gui/**", "src/zylab/main.py"]
project-includes = ["**/*.ipynb", "**/*.py*"]
python-version   = "3.8"
search-path      = ["."]
