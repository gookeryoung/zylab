meta:
  id: dsl.sensitivity_probit
  name: 方法201 概率单位法
  discipline: reliability
  description: 概率单位法（Probit）感度试验模拟与极大似然估计（GJB/Z 377A 方法201，等间隔固定水平表）。
  tags: [可靠性, 感度试验]
params:
  试验设置:
    items:
      mu: {value: 10.0, min: -1000.0, max: 1000.0}
      sigma: {value: 1.0, min: 0.001, max: 100.0}
      n_levels: {value: 7, min: 2, max: 50}
      n_per_level: {value: 12, min: 1, max: 100}
      x_low: {value: 6.0, min: -1000.0, max: 1000.0}
      x_high: {value: 14.0, min: -1000.0, max: 1000.0}
      seed: {value: 5, min: 0, max: 1000000}
pipeline:
  - id: test
    type: reliability.sensitivity_test
    params:
      method: probit
      model: normal
      mu: "$mu"
      sigma: "$sigma"
      n_levels: "$n_levels"
      n_per_level: "$n_per_level"
      x_low: "$x_low"
      x_high: "$x_high"
      seed: "$seed"
results:
  - id: curve
    group: 分析结果
    kind: curve
    title: 响应概率拟合曲线
    x: test.curve_x
    y: test.curve_p
    x_label: 刺激量
    y_label: 响应概率
  - id: summary
    group: 分析结果
    kind: text
    title: 估计摘要
    text: "μ̂ = {mu:.4f}，σ̂ = {sigma:.4f}（{estimator}，收敛={converged}）"
    values:
      mu: "test.mu_hat"
      sigma: "test.sigma_hat"
      estimator: "test.estimate.estimator"
      converged: "test.estimate.converged"
  - id: records
    group: 分析结果
    kind: table
    title: 试验记录
    columns:
      - {title: 刺激量, ref: test.levels}
      - {title: 响应, ref: test.responses}
report:
  exports: [md, html]
  sections:
    - title: 响应概率曲线
      figure: curve
    - title: 估计摘要
      figure: summary
    - title: 试验记录
      figure: records
docs:
  intro: {text: 概率单位法在试验区间内布置等间隔固定水平，每水平多发试样，响应概率经正态（Probit）变换后做极大似然估计；水平表覆盖 0% 至 100% 响应区时估计最稳定。}
