meta:
  id: dsl.sensitivity_langlie
  name: 方法101 兰利法
  discipline: reliability
  description: 兰利法感度试验模拟与极大似然统计估计（GJB/Z 377A 方法101，混合区间中点序贯设计）。
  tags: [可靠性, 感度试验]
params:
  试验设置:
    items:
      mu: {value: 10.0, min: -1000.0, max: 1000.0}
      sigma: {value: 1.0, min: 0.001, max: 100.0}
      n_total: {value: 30, min: 4, max: 200}
      x_low: {value: 6.0, min: -1000.0, max: 1000.0}
      x_high: {value: 14.0, min: -1000.0, max: 1000.0}
      seed: {value: 7, min: 0, max: 1000000}
pipeline:
  - id: test
    type: reliability.sensitivity_test
    params:
      method: langlie
      model: logistic
      mu: "$mu"
      sigma: "$sigma"
      n_total: "$n_total"
      x_low: "$x_low"
      x_high: "$x_high"
      seed: "$seed"
results:
  - id: curve
    group: 分析结果
    kind: curve
    title: 响应概率拟合曲线
    x: test.curve_x
    y: test.curve_p
    x_label: 刺激量
    y_label: 响应概率
  - id: summary
    group: 分析结果
    kind: text
    title: 估计摘要
    text: "μ̂ = {mu:.4f}，σ̂ = {sigma:.4f}（{estimator}，收敛={converged}）"
    values:
      mu: "test.mu_hat"
      sigma: "test.sigma_hat"
      estimator: "test.estimate.estimator"
      converged: "test.estimate.converged"
  - id: records
    group: 分析结果
    kind: table
    title: 试验记录
    columns:
      - {title: 刺激量, ref: test.levels}
      - {title: 响应, ref: test.responses}
report:
  exports: [md, html]
  sections:
    - title: 响应概率曲线
      figure: curve
    - title: 估计摘要
      figure: summary
    - title: 试验记录
      figure: records
docs:
  intro: {text: 兰利法以「最大全不响应水平」与「最小全响应水平」的中点作为下一试验刺激量，试验水平始终夹在响应与不响应之间，以较少发数收敛到 50% 响应点。}
