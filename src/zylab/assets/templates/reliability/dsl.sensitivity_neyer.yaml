meta:
  id: dsl.sensitivity_neyer
  name: Neyer D-最优法
  discipline: reliability
  description: Neyer D-最优序贯法感度试验模拟与极大似然估计（国际通用高效序贯设计，非国标编号方法）。
  tags: [可靠性, 感度试验]
params:
  试验设置:
    items:
      mu: {value: 10.0, min: -1000.0, max: 1000.0}
      sigma: {value: 1.0, min: 0.001, max: 100.0}
      n_total: {value: 30, min: 4, max: 1000}
      x_low: {value: 6.0, min: -1000.0, max: 1000.0}
      x_high: {value: 14.0, min: -1000.0, max: 1000.0}
      seed: {value: 7, min: 0, max: 1000000}
pipeline:
  - id: test
    type: reliability.sensitivity_test
    params:
      method: neyer
      model: logistic
      mu: "$mu"
      sigma: "$sigma"
      n_total: "$n_total"
      x_low: "$x_low"
      x_high: "$x_high"
      seed: "$seed"
results:
  - id: curve
    group: 分析结果
    kind: curve
    title: 响应概率拟合曲线
    x: test.curve_x
    y: test.curve_p
    x_label: 刺激量
    y_label: 响应概率
  - id: summary
    group: 分析结果
    kind: text
    title: 估计摘要
    text: "μ̂ = {mu:.4f}（95% CI [{mu_lo:.4f}, {mu_hi:.4f}]），σ̂ = {sigma:.4f}（{estimator}，收敛={converged}）"
    values:
      mu: "test.mu_hat"
      mu_lo: "test.ci_mu_low"
      mu_hi: "test.ci_mu_high"
      sigma: "test.sigma_hat"
      estimator: "test.estimate.estimator"
      converged: "test.estimate.converged"
  - id: records
    group: 分析结果
    kind: table
    title: 试验记录
    columns:
      - {title: 刺激量, ref: test.levels}
      - {title: 响应, ref: test.responses}
report:
  exports: [md, html]
  sections:
    - title: 响应概率曲线
      figure: curve
    - title: 估计摘要
      figure: summary
    - title: 试验记录
      figure: records
docs:
  intro: {text: Neyer D-最优序贯法在响应未翻转时以指数递增步长快速外推定位翻转区，翻转后按 Fisher 信息行列式最大化选点；相比兰利法对折半收缩，参数估计收敛更快，适合初始区间较宽的场合。}
