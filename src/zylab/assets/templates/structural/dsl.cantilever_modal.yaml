meta:
  id: dsl.cantilever_modal
  name: 悬臂梁模态分析
  discipline: structural
  description: Q4 悬臂梁固有频率分析，输出各阶频率表、基频摘要与报告。
  tags: [CAE, 模态]
params:
  几何:
    items:
      length: {value: 40.0, unit: mm, min: 1.0, max: 500.0}
      height: {value: 8.0, unit: mm, min: 0.5, max: 100.0}
      nx: {value: 20, min: 2, max: 200}
      ny: {value: 4, min: 1, max: 50}
  材料:
    items:
      e_modulus: {value: 2.1e5, unit: MPa, min: 1.0e3, max: 1.0e12}
      density: {value: 7.85e-9, unit: t/mm³, min: 1.0e-12, max: 1.0e-3}
      poisson: {value: 0.3, min: 0.0, max: 0.49}
  求解:
    items:
      n_modes: {value: 6, min: 1, max: 30}
pipeline:
  - id: model
    type: example.cantilever_q4
    params:
      length: "$length"
      height: "$height"
      nx: "$nx"
      ny: "$ny"
      e_modulus: "$e_modulus"
      density: "$density"
      poisson: "$poisson"
  - id: solve
    type: analysis.modal
    params:
      n_modes: "$n_modes"
    inputs: {model: model.model}
results:
  - id: freq_table
    kind: table
    title: 固有频率
    columns:
      - {ref: solve.frequencies_hz, title: 频率 (Hz)}
      - {ref: solve.frequencies, title: 圆频率 (rad/s)}
  - id: summary
    kind: text
    title: 摘要
    text: "提取 {n} 阶模态，基频 {f1:.6g} Hz"
    values: {n: solve.n_modes, f1: solve.frequencies_hz.0}
report:
  exports: [md, html]
  sections:
    - title: 固有频率
      table: freq_table
      text: "材料 E={e_modulus} MPa、密度 {density} t/mm³，单元划分 {nx}×{ny}。"
docs:
  intro: {text: 悬臂梁低阶模态以弯曲为主，基频随梁长增加与厚度减小而降低。}
