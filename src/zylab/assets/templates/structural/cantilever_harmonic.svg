<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif">
  <!-- 固定墙（阴影线表示刚性约束） -->
  <line x1="84" y1="38" x2="84" y2="152" stroke="#475569" stroke-width="2"/>
  <g stroke="#94A3B8" stroke-width="1">
    <line x1="84" y1="48" x2="72" y2="60"/>
    <line x1="84" y1="68" x2="72" y2="80"/>
    <line x1="84" y1="88" x2="72" y2="100"/>
    <line x1="84" y1="108" x2="72" y2="120"/>
    <line x1="84" y1="128" x2="72" y2="140"/>
  </g>
  <!-- 悬臂梁 -->
  <rect x="84" y="88" width="436" height="22" fill="#CBD5E1" stroke="#475569" stroke-width="1.5"/>
  <!-- 一阶变形示意（虚线） -->
  <path d="M84 99 C 300 99 460 128 516 164" fill="none" stroke="#3B82F6" stroke-width="1.6" stroke-dasharray="7 5"/>
  <!-- 端部简谐力箭头 -->
  <line x1="520" y1="54" x2="520" y2="146" stroke="#EF4444" stroke-width="2.2"/>
  <polygon points="520,156 513,142 527,142" fill="#EF4444"/>
  <text x="534" y="72" font-size="15" fill="#EF4444">F(t) = F₀ sin ωt</text>
  <!-- 长度标注 -->
  <line x1="84" y1="182" x2="520" y2="182" stroke="#64748B" stroke-width="1"/>
  <line x1="84" y1="176" x2="84" y2="188" stroke="#64748B" stroke-width="1"/>
  <line x1="520" y1="176" x2="520" y2="188" stroke="#64748B" stroke-width="1"/>
  <text x="292" y="200" font-size="13" fill="#64748B">L</text>
  <!-- 截面标注 -->
  <rect x="536" y="86" width="26" height="26" fill="#CBD5E1" stroke="#475569" stroke-width="1.2"/>
  <text x="536" y="128" font-size="12" fill="#64748B">b × h</text>
  <!-- 频响共振峰缩略曲线（右下） -->
  <path d="M440 224 C 480 224 500 210 512 196 C 522 184 526 178 532 182 C 538 188 546 214 580 224" fill="none" stroke="#3B82F6" stroke-width="1.4"/>
  <circle cx="530" cy="179" r="3" fill="#EF4444"/>
</svg>
