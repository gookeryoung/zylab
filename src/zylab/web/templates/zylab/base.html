<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}zylab Web{% endblock %}</title>
  <style>
    :root {
      --primary: #056574;
      --bg: #f5f7f8;
      --card: #ffffff;
      --text: #1f2933;
      --muted: #6b7680;
      --border: #e3e8ea;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 28px;
      background: var(--primary);
      color: #fff;
    }
    .topbar .brand { font-size: 18px; font-weight: 600; letter-spacing: 0.5px; }
    .topbar .brand em { font-style: normal; opacity: 0.75; font-weight: 400; }
    .content { max-width: 960px; margin: 32px auto; padding: 0 24px; }
    .page-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 16px; }
    .page-head h1 { font-size: 20px; font-weight: 600; }
    .page-head .count { color: var(--muted); font-size: 13px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 12px 18px; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 500; font-size: 13px; background: #fafbfc; }
    tr:last-child td { border-bottom: none; }
    td.name { font-weight: 500; }
    td .path { color: var(--muted); font-size: 12px; margin-top: 2px; }
    td.num, th.num { text-align: right; }
    .empty { padding: 48px 24px; text-align: center; color: var(--muted); font-size: 14px; }
    {% block style %}{% endblock %}
  </style>
</head>
<body>
  <header class="topbar">
    <span class="brand">zylab <em>Web</em></span>
    {% block nav %}{% endblock %}
  </header>
  <main class="content">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
